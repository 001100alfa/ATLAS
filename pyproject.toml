[project]
name = "atlas"
version = "0.4.1"
description = "ATLAS - otonom mühendislik ajanı çekirdek kütüphanesi"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "ezdxf>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML>=6.0"]
# NOT: FastAPI/WebSocket desk (skills/trading) eklendiğinde `api` extra'sı
# burada tanımlanacak; atıl bağımlılık tutulmaz.

[project.scripts]
atlas = "atlas_core.cli:main"
atlas-sections = "sections.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff.lint.per-file-ignores]
# EN 1993 gösterimi (Iy, Wel_y...) proje standardıdır; N806 burada geçersiz.
"src/sections/*.py" = ["N806"]
