name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tip kontrolü (mypy --strict)
        run: mypy src
      - name: JS sözdizimi (Juggler eklentisi + araçlar)
        run: git ls-files '*.js' | xargs -r -n1 node --check
      - name: Sır taraması (atlas scan)
        run: python -m atlas_core.cli scan src
      - name: Testler + coverage
        run: pytest --cov=sections --cov=atlas_core --cov-fail-under=90

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Testler (Windows regresyon)
        run: pytest
