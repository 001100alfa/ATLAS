name: atlas-doctor
# SPEC 070: PR + push'da ATLAS doctor sağlık kapısı.
# SPEC 062 --auto-baseline ile snapshot varsa delta karşılaştırması;
# yoksa fresh doctor --strict --scan-src ile mutlak sağlık.
# SPEC 056 (vault-health) kardeşi — aynı kalıp, farklı gate.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "DECISIONS.md"
      - ".atlas/doctor-baseline.json"
      - ".github/workflows/atlas-doctor.yml"
  pull_request:
    paths:
      - "src/**"
      - "DECISIONS.md"
      - ".github/workflows/atlas-doctor.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: atlas-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: atlas doctor --strict --scan-src
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install ATLAS
        run: uv sync --frozen --extra dev

      - name: Run atlas doctor --strict --scan-src
        id: doctor
        continue-on-error: true
        env:
          # SPEC 062: baseline varsa auto-diff; yoksa fresh strict.
          # Repo `.atlas/doctor-baseline.json` commit'liyse otomatik
          # kullanılır (CI regresyon gate).
          ATLAS_STRICT_DRIFT_DAYS: "30"
          ATLAS_MIN_DECISIONS_ENTRIES: "1"
        run: |
          set +e
          # 1) Fresh strict + scan_src (SPEC 032/032.2)
          uv run atlas doctor --strict --scan-src --json > doctor-report.json
          rc_strict=$?
          # 2) Baseline varsa auto-diff regresyon (SPEC 062)
          if [ -f .atlas/doctor-baseline.json ]; then
              uv run atlas doctor --strict --auto-baseline > doctor-diff.txt 2>&1
              rc_diff=$?
              echo "rc_diff=$rc_diff" >> "$GITHUB_OUTPUT"
          else
              rc_diff=0
              echo "rc_diff=0" >> "$GITHUB_OUTPUT"
              echo "(baseline yok — --save-baseline ile CI regresyon açılır)" > doctor-diff.txt
          fi
          echo "rc_strict=$rc_strict" >> "$GITHUB_OUTPUT"

      - name: Generate diff-history-all trend (SPEC 091/100)
        run: |
          # SPEC 091: tum tarihce ile mevcut arasi toplu diff.
          # Tarihce yoksa/bossa || fallback bos snapshots (fail-safe).
          uv run atlas doctor --diff-history-all --json \
            > doctor-diff-history-all.json 2>/dev/null \
            || echo '{"snapshots":[]}' > doctor-diff-history-all.json

      - name: Doctor history regression gate (SPEC 097/130)
        id: history_gate
        continue-on-error: true
        run: |
          # SPEC 097: --diff-history-all --strict → herhangi snapshot'ta
          # regresyon → exit 9. Tarihçe yoksa skip (fail-safe).
          set +e
          if [ -d .atlas/doctor-history ] && \
             ls .atlas/doctor-history/baseline-*.json >/dev/null 2>&1; then
              uv run atlas doctor --diff-history-all --strict \
                > doctor-history-strict.txt 2>&1
              rc_hist=$?
              echo "rc_hist=$rc_hist" >> "$GITHUB_OUTPUT"
          else
              echo "(tarihçe yok — --save-baseline default path ile açılır)" \
                > doctor-history-strict.txt
              echo "rc_hist=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate schema prometheus artifact (SPEC 147)
        run: |
          # SPEC 128/134: --schema --format prometheus info-metric,
          # --out --gzip artifact boyutu için. Kısa devre — her zaman çalışır.
          uv run atlas doctor --schema --format prometheus \
            --out doctor-schema.prom --gzip \
            || echo "(doctor schema uretilemedi)" > doctor-schema.prom.gz

      - name: Upload doctor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-doctor-report
          path: |
            doctor-report.json
            doctor-diff.txt
            doctor-diff-history-all.json
            doctor-history-strict.txt
            doctor-schema.prom.gz
          retention-days: 30

      - name: Comment PR on failure
        if: >-
          github.event_name == 'pull_request'
          && (steps.doctor.outputs.rc_strict != '0' || steps.doctor.outputs.rc_diff != '0')
          && hashFiles('doctor-diff.txt') != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: doctor-diff.txt

      - name: Post doctor alert webhook (SPEC 131/135)
        if: >-
          env.ALERT_WEBHOOK_URL != ''
          && (steps.doctor.outputs.rc_strict != '0'
              || steps.doctor.outputs.rc_diff != '0'
              || steps.history_gate.outputs.rc_hist != '0')
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ATLAS_ALERT_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          # SPEC 131 kalibi: doctor gate FAIL ise env webhook'a POST.
          # Env yok/boşsa step conditional ile atlar.
          payload=$(cat <<EOF
          {"alert":"doctor",
           "rc_strict":"${{ steps.doctor.outputs.rc_strict }}",
           "rc_diff":"${{ steps.doctor.outputs.rc_diff }}",
           "rc_hist":"${{ steps.history_gate.outputs.rc_hist }}",
           "run_id":"${{ github.run_id }}",
           "sha":"${{ github.sha }}"}
          EOF
          )
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$ALERT_WEBHOOK_URL" || true

      - name: Fail the workflow on quality issues
        if: >-
          steps.doctor.outputs.rc_strict != '0'
          || steps.doctor.outputs.rc_diff != '0'
          || steps.history_gate.outputs.rc_hist != '0'
        run: |
          echo "::error::atlas doctor gate başarısız (strict=${{ steps.doctor.outputs.rc_strict }}, diff=${{ steps.doctor.outputs.rc_diff }}, hist=${{ steps.history_gate.outputs.rc_hist }})"
          echo "Detay: doctor-diff.txt / doctor-report.json / doctor-history-strict.txt artifact."
          exit 1
