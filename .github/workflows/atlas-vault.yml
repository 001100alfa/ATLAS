name: atlas-vault
# SPEC 107: vault backup scheduled + split artifact.
# Her gün 03:00 UTC (Istanbul 06:00) çalışır; parçalı yedek + retention.
# SPEC 041/101/102 üzerine üretim uzantısı.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: atlas-vault-daily
  cancel-in-progress: false

jobs:
  backup:
    name: vault backup --auto --split 50 --keep 7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install ATLAS
        run: uv sync --frozen --extra dev

      - name: Check vault exists
        id: vault_check
        run: |
          if [ -d vault ]; then
            echo "has_vault=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vault=false" >> "$GITHUB_OUTPUT"
            echo "(vault/ dizini yok — backup atlaniyor)"
          fi

      - name: Run atlas vault backup --auto --split 50 --keep 7
        id: backup
        if: steps.vault_check.outputs.has_vault == 'true'
        continue-on-error: true
        run: |
          # SPEC 041/101: --auto scheduled explicit; --split 50 MB parça;
          # --keep 7 retention (7 gün eski yedek).
          # SPEC 193: continue-on-error ile ki fail durumunda webhook step
          # çalışabilsin (SPEC 178 CLI --alert-webhook workflow kardeşi).
          set +e
          uv run atlas vault backup --auto --split 50 --keep 7
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Post vault-backup alert webhook (SPEC 135/141/185/191/193)
        if: >-
          env.ALERT_WEBHOOK_URL != ''
          && steps.backup.outputs.rc != '0'
          && steps.backup.outputs.rc != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ATLAS_ALERT_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          # SPEC 131/135/141/185 kalibi: vault backup fail (rc != 0) ise
          # env webhook'a POST. Env yoksa step atlar. SPEC 191 timestamp.
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(cat <<EOF
          {"alert":"vault-backup",
           "rc":"${{ steps.backup.outputs.rc }}",
           "run_id":"${{ github.run_id }}",
           "sha":"${{ github.sha }}",
           "timestamp":"$ts"}
          EOF
          )
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$ALERT_WEBHOOK_URL" || true

      - name: Restore + verify (integrity check, SPEC 112)
        if: steps.vault_check.outputs.has_vault == 'true'
        run: |
          # SPEC 102: split parçalardan restore
          # SPEC 042: verify --strict → bulgu varsa exit 4
          set -e
          FIRST=$(ls archive/vault-*.tar.gz.001 2>/dev/null | sort | tail -1)
          if [ -z "$FIRST" ]; then
            echo "::error::SPEC 112: split .001 parça bulunamadı"
            exit 1
          fi
          echo "SPEC 112: integrity restore ilk parça = $FIRST"
          rm -rf /tmp/verify-vault
          uv run atlas vault restore "$FIRST" --split --apply \
            --vault-root /tmp/verify-vault
          uv run atlas vault verify --vault-root /tmp/verify-vault --strict
          echo "SPEC 112: integrity OK — restore + verify başarılı"

      - name: Doctor gate on restored vault (SPEC 117)
        if: steps.vault_check.outputs.has_vault == 'true'
        env:
          ATLAS_VAULT: /tmp/verify-vault
        run: |
          # SPEC 032/032.2 + 117: restore edilen vault üzerinde doctor
          # sağlık gate — quality.* uyarısı varsa exit 9.
          set -e
          uv run atlas doctor --strict --scan-src
          echo "SPEC 117: doctor gate başarılı — restore edilen vault sağlıklı"

      - name: Verify retention (--keep 7, SPEC 041.1/124)
        if: steps.vault_check.outputs.has_vault == 'true'
        run: |
          # SPEC 041.1: --keep 7 retention — arşivde 7'den fazla yedek
          # (parça dahil) tutulmaz. Her parça 'vault-...tar.gz.NNN'.
          # Beklenen yedek yolu: 1 backup × N split part (bugun),
          # 6 gün öncesine kadar eski yedeklerin parçaları.
          set -e
          count=$(find archive/ -maxdepth 1 -name 'vault-*.tar.gz.*' | wc -l)
          echo "SPEC 124: archive/ vault-*.tar.gz.* dosya sayisi = $count"
          # Bir günlük backup ~ N parça (50 MB); 7 gün retention → 7×N parça
          # üstü sınırı absolute değil, ama retention bit-uyumu şart. Sadece
          # dosya varlığını + retention semantiğini teyit et:
          if [ "$count" -lt 1 ]; then
            echo "::error::SPEC 124: hiç parça bulunamadi — --split calismadi"
            exit 1
          fi
          # SPEC 041.1 --keep 7: eski (7 günden eski) `vault-*.tar.gz`
          # dosyaları prune edilmiş olmalı (retention). --keep parça
          # dosyalarını değil, ana tar.gz'leri sayar; split sonrası ana
          # tar.gz silindiği için archive/ sadece .NNN'ler tutar.
          orig_count=$(find archive/ -maxdepth 1 -name 'vault-*.tar.gz' -not -name '*.gz.*' | wc -l)
          echo "SPEC 124: original vault-*.tar.gz sayisi = $orig_count (beklenen: 0, split sonrasi silinir)"
          if [ "$orig_count" -gt 0 ]; then
            echo "::warning::SPEC 124: split sonrasi ana .tar.gz olmamali"
          fi
          echo "SPEC 124: retention verify OK ($count parca dosyasi)"

      - name: Upload split parts artifact
        if: steps.vault_check.outputs.has_vault == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vault-backup-parts
          path: |
            archive/vault-*.tar.gz.*
          retention-days: 30

      - name: Generate vault verify schema prometheus artifact (SPEC 161)
        run: |
          # SPEC 136/140/145: --schema --format prometheus --out --gzip
          # Kısa devre — vault gerekmez, her zaman çalışır.
          uv run atlas vault verify --schema --format prometheus \
            --out vault-verify-schema.prom --gzip \
            || echo "(vault verify schema uretilemedi)" > vault-verify-schema.prom.gz

      - name: Generate vault backup schema prometheus artifact (SPEC 161/163/173)
        run: |
          # SPEC 154/158/163: --schema --format prometheus info-metric,
          # NATIVE --out --gzip (SPEC 173 shell gzip → native taşıma).
          # Kısa devre — her zaman çalışır.
          uv run atlas vault backup --schema --format prometheus \
            --out vault-backup-schema.prom --gzip \
            || echo "(vault backup schema uretilemedi)" > vault-backup-schema.prom.gz

      - name: Upload atlas-vault schema artifacts (SPEC 161)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-vault-schema
          path: |
            vault-verify-schema.prom.gz
            vault-backup-schema.prom.gz
          retention-days: 30
          if-no-files-found: ignore
