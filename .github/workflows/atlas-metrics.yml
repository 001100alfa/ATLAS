name: atlas-metrics
# SPEC 074: PR'da .atlas/metrics.jsonl artifact + insan-okunur özet
# comment (SPEC 023 metrics özeti + SPEC 043 Prometheus text).
# SPEC 056 (vault-health) / SPEC 070 (atlas-doctor) kardeşi.

on:
  push:
    branches: [main]
    paths:
      - ".atlas/metrics.jsonl"
      - ".github/workflows/atlas-metrics.yml"
  pull_request:
    paths:
      - ".atlas/metrics.jsonl"
      - ".github/workflows/atlas-metrics.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: atlas-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    name: atlas metrics özet
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install ATLAS
        run: uv sync --frozen --extra dev

      - name: Generate metrics özet
        id: metrics
        run: |
          set +e
          if [ -f .atlas/metrics.jsonl ]; then
              uv run atlas metrics --limit 100 > metrics-human.txt
              uv run atlas metrics --limit 100 --json > metrics.json
              uv run atlas metrics --limit 100 --format prometheus > metrics.prom
              echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
              echo "(no metrics.jsonl in repo)" > metrics-human.txt
              echo "[]" > metrics.json
              echo "# no metrics" > metrics.prom
              echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate cost by day (SPEC 084/095)
        if: steps.metrics.outputs.has_data == 'true'
        run: |
          # Env fiyat yoksa cost 0.0 + UYARI stderr — workflow durmaz.
          uv run atlas metrics --limit 100 \
            --group-by day --with-cost --json \
            > metrics-cost-by-day.json || echo '{"unit":"day","groups":[]}' > metrics-cost-by-day.json

      - name: Generate group prometheus (gzip, SPEC 103/113)
        if: steps.metrics.outputs.has_data == 'true'
        run: |
          # SPEC 103: --gzip artifact boyutu için sıkıştırma.
          # --out zorunlu; auto-suffix `.gz` uygulanır.
          uv run atlas metrics --limit 100 \
            --group-by day --format prometheus \
            --out metrics-group-day.prom --gzip \
            || echo "(group prometheus üretilemedi)" > metrics-group-day.prom.gz

      - name: Generate metrics schema prometheus artifact (SPEC 160)
        run: |
          # SPEC 153/157: --schema --format prometheus info-metric,
          # shell gzip artifact boyutu için (metrics --out --gzip henüz
          # yok). Kısa devre — her zaman çalışır.
          uv run atlas metrics --schema --format prometheus \
            > metrics-schema.prom \
            && gzip -f metrics-schema.prom \
            || echo "(metrics schema uretilemedi)" > metrics-schema.prom.gz

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-metrics-report
          path: |
            metrics-human.txt
            metrics.json
            metrics.prom
            metrics-cost-by-day.json
            metrics-group-day.prom.gz
            metrics-schema.prom.gz
            .atlas/alert-history.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with human summary
        if: >-
          github.event_name == 'pull_request'
          && steps.metrics.outputs.has_data == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: metrics-human.txt

      - name: Post alert webhook (SPEC 064/131)
        if: >-
          steps.metrics.outputs.has_data == 'true'
          && env.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ATLAS_ALERT_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          # SPEC 064: cache-hit oranı %30 altına düşerse env webhook'a POST.
          # Env yok/boşsa step conditional ile atlar (SPEC 095 fail-safe).
          # continue-on-error: true — POST başarısız olursa job kırılmasın.
          uv run atlas metrics --limit 100 --alert 30 \
            --alert-webhook "$ALERT_WEBHOOK_URL"
