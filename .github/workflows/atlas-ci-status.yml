name: atlas-ci-status
# SPEC 089: SPEC 082 drift gate'in günlük planlı çalışması.
# shields.io badge SVG cache invalidation + hafta boyunca kimse workflow
# eklemezse README drift'i günlük tarama.

on:
  schedule:
    # Her gün 06:00 UTC (Istanbul 09:00). Deterministik saat.
    - cron: "0 6 * * *"
    # SPEC 119: Haftalık ek tetik — Pazartesi 07:00 UTC (retrospektif).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: atlas-ci-status-daily
  cancel-in-progress: false

jobs:
  drift-scan:
    name: README ci-status günlük drift tarama
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install ATLAS
        run: uv sync --frozen --extra dev

      - name: Run gen_ci_badges.py --check
        id: check
        continue-on-error: true
        run: |
          set +e
          python tools/scripts/gen_ci_badges.py --check
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Build issue body (on drift)
        if: steps.check.outputs.rc != '0'
        run: |
          python tools/scripts/gen_ci_badges.py
          {
            echo "### README ci-status günlük drift tespit edildi"
            echo ""
            echo "Yerelde çalıştırıp commit'leyin:"
            echo ""
            echo '```sh'
            echo "python tools/scripts/gen_ci_badges.py"
            echo 'git add README.md && git commit -m "docs: ci-status badge güncelleme"'
            echo '```'
            echo ""
            echo "Tetik: **${{ github.event_name }}** — ${{ github.run_id }}"
          } > drift-issue.md

      - name: Open issue on drift
        if: steps.check.outputs.rc != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ci-status drift — README badge tablosu güncel değil"
          content-filepath: drift-issue.md
          labels: |
            ci-status
            drift
            automated

      - name: Upload drift diff artifact (SPEC 125)
        if: steps.check.outputs.rc != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ci-status-drift-readme
          path: |
            README.md
            drift-issue.md
          retention-days: 30

      - name: Post ci-status alert webhook (SPEC 131/141)
        if: >-
          env.ALERT_WEBHOOK_URL != ''
          && steps.check.outputs.rc != '0'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ATLAS_ALERT_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          # SPEC 131/135 kalibi: drift tespitinde env webhook'a POST.
          # Env yok/bossa step conditional ile atlar.
          # continue-on-error: webhook fail workflow durdurmaz.
          payload=$(cat <<EOF
          {"alert":"ci-status",
           "rc":"${{ steps.check.outputs.rc }}",
           "run_id":"${{ github.run_id }}",
           "sha":"${{ github.sha }}",
           "event":"${{ github.event_name }}"}
          EOF
          )
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$ALERT_WEBHOOK_URL" || true

      - name: Generate archive schema prometheus artifact (SPEC 152/155/174)
        run: |
          # SPEC 149/151/155: --schema --format prometheus info-metric,
          # NATIVE --out --gzip (SPEC 174 shell gzip → native taşıma;
          # SPEC 173 metrics/vault backup kardeşi). Kısa devre — her zaman çalışır.
          uv run atlas archive --schema --format prometheus \
            --out archive-schema.prom --gzip \
            || echo "(archive schema uretilemedi)" > archive-schema.prom.gz

      - name: Upload atlas-ci-status schema artifact (SPEC 152)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ci-status-schema
          path: archive-schema.prom.gz
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on drift
        if: steps.check.outputs.rc != '0'
        run: |
          echo "::error::README ci-status bloğu drift — issue açıldı."
          exit 1
